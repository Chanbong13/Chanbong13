name: Deploy LifePilot to Vercel

on:
  push:
    branches:
      - claude/lifepilot-fullstack-app-S0Q3l
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Supavisor transaction pooler — reachable from Vercel serverless runtime
      DATABASE_URL: "postgresql://postgres.dwkmjktlyvjnhluzrawc:FreeDom%40020401CB@aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require"
      # Direct connection — used only by prisma db push in CI (GitHub Actions can reach port 5432)
      DATABASE_URL_DIRECT: "postgresql://postgres:FreeDom%40020401CB@db.dwkmjktlyvjnhluzrawc.supabase.co:5432/postgres?sslmode=require&connect_timeout=15"
      NEXTAUTH_SECRET: "lifepilot-production-secret-s3cur3"
      NEXTAUTH_URL: "https://lifepilot-ashen.vercel.app"
      NEXT_PUBLIC_APP_URL: "https://lifepilot-ashen.vercel.app"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Link Vercel project (explicit name)
        run: vercel link --yes --project lifepilot --token=$VERCEL_TOKEN

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Push database schema
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss || echo "Warning: DB push failed (schema may already exist)"
          npx tsx prisma/seed.ts || echo "Warning: Seed skipped (data may already exist)"

      - name: Set environment variables in Vercel
        run: |
          # Remove from ALL scopes to avoid stale values winning over the new one
          for env in production preview development; do
            vercel env rm DATABASE_URL         $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
            vercel env rm DATABASE_URL_DIRECT  $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
            vercel env rm NEXTAUTH_SECRET      $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
            vercel env rm NEXTAUTH_URL         $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
            vercel env rm NEXT_PUBLIC_APP_URL  $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
            vercel env rm GOOGLE_CLIENT_ID     $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
            vercel env rm GOOGLE_CLIENT_SECRET $env --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          done

          echo "$DATABASE_URL"         | vercel env add DATABASE_URL         production --token=$VERCEL_TOKEN
          echo "$NEXTAUTH_SECRET"      | vercel env add NEXTAUTH_SECRET      production --token=$VERCEL_TOKEN
          echo "$NEXTAUTH_URL"         | vercel env add NEXTAUTH_URL         production --token=$VERCEL_TOKEN
          echo "$NEXT_PUBLIC_APP_URL"  | vercel env add NEXT_PUBLIC_APP_URL  production --token=$VERCEL_TOKEN
          echo "$GOOGLE_CLIENT_ID"     | vercel env add GOOGLE_CLIENT_ID     production --token=$VERCEL_TOKEN
          echo "$GOOGLE_CLIENT_SECRET" | vercel env add GOOGLE_CLIENT_SECRET production --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        run: |
          FINAL_URL=$(vercel --prod --yes --token=$VERCEL_TOKEN | tail -1)
          echo "================================================"
          echo "  ✅ LifePilot is LIVE!"
          echo "  🌐 URL: $FINAL_URL"
          echo "  🌐 Stable: https://lifepilot-ashen.vercel.app"
          echo "  📧 Demo: demo@lifepilot.app / demo1234"
          echo "================================================"
