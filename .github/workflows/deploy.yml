name: Deploy LifePilot to Vercel

on:
  push:
    branches:
      - claude/lifepilot-fullstack-app-S0Q3l
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: "postgresql://postgres:FreeDom%40020401CB@db.dwkmjktlyvjnhluzrawc.supabase.co:5432/postgres"
      NEXTAUTH_SECRET: "lifepilot-production-secret-s3cur3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Link Vercel project (explicit name)
        run: vercel link --yes --project lifepilot --token=$VERCEL_TOKEN

      - name: Set environment variables in Vercel
        run: |
          vercel env rm DATABASE_URL        production --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          vercel env rm NEXTAUTH_SECRET     production --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          vercel env rm NEXTAUTH_URL        production --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          vercel env rm NEXT_PUBLIC_APP_URL production --yes --token=$VERCEL_TOKEN 2>/dev/null || true

          echo "$DATABASE_URL"    | vercel env add DATABASE_URL      production --token=$VERCEL_TOKEN
          echo "$NEXTAUTH_SECRET" | vercel env add NEXTAUTH_SECRET   production --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        run: |
          DEPLOY_URL=$(vercel --prod --yes --token=$VERCEL_TOKEN | tail -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "Deployed to: $DEPLOY_URL"

      - name: Update NEXTAUTH_URL with real domain
        run: |
          vercel env rm NEXTAUTH_URL        production --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          vercel env rm NEXT_PUBLIC_APP_URL production --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          echo "$DEPLOY_URL" | vercel env add NEXTAUTH_URL        production --token=$VERCEL_TOKEN
          echo "$DEPLOY_URL" | vercel env add NEXT_PUBLIC_APP_URL production --token=$VERCEL_TOKEN

      - name: Redeploy with correct NEXTAUTH_URL
        run: |
          FINAL_URL=$(vercel --prod --yes --token=$VERCEL_TOKEN | tail -1)
          echo "================================================"
          echo "  ✅ LifePilot is LIVE!"
          echo "  🌐 URL: $FINAL_URL"
          echo "  📧 Demo: demo@lifepilot.app / demo1234"
          echo "================================================"
