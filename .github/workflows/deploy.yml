name: Deploy LifePilot to Vercel

on:
  push:
    branches:
      - claude/lifepilot-fullstack-app-S0Q3l
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:FreeDom%40020401CB@db.dwkmjktlyvjnhluzrawc.supabase.co:5432/postgres"
      NEXTAUTH_SECRET: "lifepilot-production-secret-s3cur3"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to Supabase
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed demo data
        run: npx tsx prisma/seed.ts
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Create Vercel project & deploy
        run: |
          # Link / create project automatically
          vercel link --yes --token=$VERCEL_TOKEN

          # Add environment variables
          for KEY in DATABASE_URL NEXTAUTH_SECRET NEXTAUTH_URL NEXT_PUBLIC_APP_URL; do
            vercel env rm $KEY production --yes --token=$VERCEL_TOKEN 2>/dev/null || true
          done

          echo "$DATABASE_URL"      | vercel env add DATABASE_URL      production --token=$VERCEL_TOKEN
          echo "$NEXTAUTH_SECRET"   | vercel env add NEXTAUTH_SECRET   production --token=$VERCEL_TOKEN

          # Deploy and capture URL
          DEPLOY_URL=$(vercel --prod --yes --token=$VERCEL_TOKEN 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | tail -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "🚀 Deployed to: $DEPLOY_URL"

          # Set NEXTAUTH_URL to the actual deploy URL
          echo "$DEPLOY_URL" | vercel env add NEXTAUTH_URL       production --token=$VERCEL_TOKEN
          echo "$DEPLOY_URL" | vercel env add NEXT_PUBLIC_APP_URL production --token=$VERCEL_TOKEN

      - name: Final redeploy with all env vars set
        run: |
          FINAL=$(vercel --prod --yes --token=$VERCEL_TOKEN 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | tail -1)
          echo ""
          echo "✅ LifePilot is LIVE at: $FINAL"

      - name: Print live URL
        run: |
          echo "============================================"
          echo "  🎉 LifePilot deployed successfully!"
          echo "  Demo login: demo@lifepilot.app / demo1234"
          echo "============================================"
